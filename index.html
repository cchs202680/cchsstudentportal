<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCHS Student Portal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #003366, #0066cc);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
      text-align: center;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 15px;
      border-radius: 50%;
      object-fit: contain;
    }

    h1 {
      color: #003366;
      font-size: 24px;
      margin-bottom: 5px;
    }

    h2 {
      color: #555;
      font-size: 16px;
      font-weight: normal;
      margin-bottom: 25px;
    }

    label {
      display: block;
      text-align: left;
      margin-bottom: 7px;
      color: #333;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #0066cc;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #003366;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0055a5;
    }

    .message {
      margin-top: 15px;
      color: #d00000;
      font-size: 14px;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <!-- CCHS LOGO -->
    <img
      class="logo"
      src="https://via.placeholder.com/90"
      alt="CCHS Logo"
    >

    <h1>Chibombo College</h1>
    <h2>of Health Sciences</h2>

    <form id="loginForm">

      <label for="studentNumber">Student Number</label>

      <input
        type="text"
        id="studentNumber"
        placeholder="Enter student number"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
      >

      <button type="submit">LOGIN</button>

      <p class="message" id="message"></p>

    </form>

    <div class="footer">
      © 2026 Chibombo College of Health Sciences
    </div>

  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {

      event.preventDefault();

      const studentNumber =
        document.getElementById("studentNumber").value;

      const password =
        document.getElementById("password").value;

      const message =
        document.getElementById("message");

      if (studentNumber === "" || password === "") {
        message.textContent = "Please enter your student number and password.";
        return;
      }

      message.textContent =
        "Login system is being set up. Please try again later.";

    });
  </script>

</body>
</html>
